<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DjangoERP{% endblock %} · DjangoERP</title>
    <style>
        :root {
            --bg: #f7f5f0;
            --fg: #24201b;
            --muted: #6b6156;
            --rule: #ddd6c8;
            --accent: #5b3a29;
            --gold: #b8860b;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1b1815;
                --fg: #ece5da;
                --muted: #a2988a;
                --rule: #3a342c;
                --accent: #c9a227;
                --gold: #d9b544;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
        }
        header {
            border-bottom: 1px solid var(--rule);
            padding: 1rem 2rem;
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 1.5rem;
        }
        header h1 { margin: 0; font-size: 1.15rem; letter-spacing: 0.02em; }
        header nav a { color: var(--accent); margin-right: 1.25rem; text-decoration: none; }
        header nav a:hover { text-decoration: underline; }
        main { max-width: 52rem; margin: 2.5rem auto; padding: 0 2rem; }
        h2 { margin-top: 0; }
        table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
        th, td { text-align: left; padding: 0.4rem 0.75rem 0.4rem 0; border-bottom: 1px solid var(--rule); }
        th { color: var(--muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; }
        code { background: var(--rule); padding: 0.1rem 0.35rem; border-radius: 0.25rem; font-size: 0.9em; }
        footer { border-top: 1px solid var(--rule); text-align: center; padding: 2rem; color: var(--muted); font-size: 0.9rem; }
        .badge {
            display: inline-block;
            background: var(--gold);
            color: var(--bg);
            border-radius: 0.4rem;
            padding: 0.05rem 0.55rem;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header>
        <h1>DjangoERP</h1>
        <nav>
            <a href="{% url 'company:home' %}">Home</a>
            <a href="{% url 'admin:index' %}">Admin</a>
            <a href="{% url 'schema-swagger-ui' %}">API docs</a>
            <a href="{% url 'company:health' %}">Health</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>Django + DRF ERP · double-entry core, supply chain, manufacturing, MRP</footer>
</body>
</html>
