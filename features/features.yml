  - id: DJERP-011
    title: "Agent simulation sandbox"
    description: "A time-stepped economy whose agents (market, customers, suppliers, sales manager, buyer, planner, line crews, machines, maintenance, plant manager, controller) act only through the ERP's services on a database flagged SIMULATION_SANDBOX; each tick is one transaction that leaves the trial balance and balance sheet balanced and the stock, receivables, payables and fixed-asset subledgers reconciled with the GL, or rolls back and halts (manage.py simulate, /api/simulation/)"
    implemented: true
    status: shipped
    prd: [FR5, FR6]
    surface: api
    link: "simulation/engine.py"
    docs: "simulation/README.md"
    tests: ["simulation/tests.py"]
  - id: DJERP-012
    title: "Claude-driven agents with bounded decisions"
    description: "Any reviewing agent can be driven by a small Claude model (claude-haiku-5-5 by default) through structured outputs: answers are clamped to each field's bounds, invalid or refused answers and API errors fall back to the heuristic policy, a per-tick call budget applies, and every call's token cost is posted to account 6300"
    implemented: true
    status: shipped
    prd: [FR7]
    surface: api
    link: "simulation/brains.py"
    docs: "docs/adr/0003-agent-simulation-sandbox.md"
    tests: ["simulation/tests.py"]
