[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "djangoerp.settings.dev"
python_files = ["tests.py", "test_*.py"]
addopts = "-v --tb=short"

[tool.isort]
line_length = 120
known_first_party = [
    "accounts", "coa", "journal", "invoices", "reports", "core", "djangoerp",
    "partners", "products", "inventory", "purchasing", "sales", "manufacturing", "mrp",
]
